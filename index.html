<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家常菜谱集</title>
<style>
:root{
  --bg:#fff8f0; --card:#ffffff; --ink:#33302b; --sub:#8a7f70; --line:#f0e2d2;
  --acc:#c1502e; --acc-soft:#fdeee6; --heat-bg:#fff3e0; --heat-line:#e8862e;
  --tip-bg:#eef6ec; --buy-bg:#eef3fa; --chip:#f3e9db; --mask:rgba(40,25,15,0.55);
}
html.dark{
  --bg:#1d1a17; --card:#2a2521; --ink:#f0e8de; --sub:#b3a693; --line:#453b32;
  --acc:#e07a52; --acc-soft:#3d2c22; --heat-bg:#3a2c1c; --heat-line:#e8862e;
  --tip-bg:#263326; --buy-bg:#232c3a; --chip:#38302a; --mask:rgba(0,0,0,0.7);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{margin:0; background:var(--bg); color:var(--ink); font-size:17px; line-height:1.65;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
.wrap{max-width:1100px; margin:0 auto; padding:16px 14px 60px}
.topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0 4px}
.brand{font-size:26px; font-weight:800; letter-spacing:1px}
.brand-sub{color:var(--sub); font-size:14px; margin-top:2px}
.dark-btn{border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:999px;
  padding:8px 14px; font-size:15px; cursor:pointer; flex:none}
.season{margin:14px 0 4px; background:var(--acc-soft); border:1px solid var(--line); border-radius:14px;
  padding:12px 14px; font-size:15px}
.season-title{font-weight:700; color:var(--acc); margin-bottom:4px}
.searchbar{margin:16px 0 10px}
.search-input{width:100%; padding:13px 16px; font-size:17px; border-radius:12px;
  border:1px solid var(--line); background:var(--card); color:var(--ink); outline:none}
.search-input:focus{border-color:var(--acc)}
.filters{margin:6px 0 4px}
.filter-group{display:flex; align-items:flex-start; gap:8px; margin:8px 0; flex-wrap:wrap}
.filter-label{font-size:14px; color:var(--sub); padding-top:7px; flex:none; width:38px}
.chip{border:1px solid var(--line); background:var(--chip); color:var(--ink); border-radius:999px;
  padding:6px 14px; font-size:15px; cursor:pointer}
.chip-on{background:var(--acc); border-color:var(--acc); color:#fff; font-weight:700}
.count-line{color:var(--sub); font-size:14px; margin:14px 0 10px}
.grid{display:grid; grid-template-columns:1fr; gap:14px}
@media (min-width:640px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1024px){ .grid{grid-template-columns:repeat(3,1fr)} }
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px;
  cursor:pointer; transition:transform 0.2s ease, box-shadow 0.2s ease}
.card:active{transform:scale(0.98)}
.card-name{font-size:20px; font-weight:800; margin-bottom:8px}
.card-tags{display:flex; flex-wrap:wrap; gap:6px}
.tag{font-size:13px; border-radius:999px; padding:2px 10px; background:var(--chip); color:var(--ink)}
.tag-cuisine{background:var(--acc); color:#fff; font-weight:700}
.tag-type{background:var(--acc-soft); color:var(--acc); font-weight:700}
.tag-time{background:transparent; border:1px solid var(--line); color:var(--sub)}
.card-desc{color:var(--sub); font-size:14px; margin-top:10px}
.empty{text-align:center; color:var(--sub); padding:50px 0; font-size:16px}
.modal-mask{display:none; position:fixed; inset:0; background:var(--mask); z-index:50;
  align-items:flex-end; justify-content:center}
.modal-mask-open{display:flex}
.modal{background:var(--bg); width:100%; max-width:760px; max-height:92vh; overflow-y:auto;
  border-radius:20px 20px 0 0; padding:20px 18px 40px; animation:up 0.25s ease}
@media (min-width:700px){ .modal-mask{align-items:center} .modal{border-radius:20px} }
@keyframes up{ from{transform:translateY(24px); opacity:0.4} to{transform:translateY(0); opacity:1} }
.modal-close{position:sticky; top:0; float:right; border:1px solid var(--line); background:var(--card);
  color:var(--ink); border-radius:999px; width:38px; height:38px; font-size:18px; cursor:pointer; z-index:2}
.d-title{font-size:24px; font-weight:800; margin:4px 0 8px}
.d-meta{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px}
.d-sec{margin:20px 0}
.d-sec-title{font-size:18px; font-weight:800; color:var(--acc); margin-bottom:8px}
.ing-list{margin:0; padding-left:20px}
.ing-item{margin:4px 0}
.step-list{display:flex; flex-direction:column; gap:10px}
.step-item{display:flex; gap:10px; background:var(--card); border:1px solid var(--line);
  border-radius:12px; padding:10px 12px}
.step-num{background:var(--acc); color:#fff; font-weight:800; border-radius:999px;
  width:26px; height:26px; text-align:center; line-height:26px; flex:none; font-size:15px}
.step-text{flex:1}
.step-time{flex:none; color:var(--acc); font-weight:700; font-size:14px; padding-top:2px}
.heat-box{background:var(--heat-bg); border:1.5px solid var(--heat-line); border-radius:12px;
  padding:12px 14px; font-size:16px}
.tip-box{background:var(--tip-bg); border-radius:12px; padding:12px 14px}
.buy-box{background:var(--buy-bg); border-radius:12px; padding:12px 14px}
.box-label{font-weight:800; margin-bottom:4px}
.src-note{color:var(--sub); font-size:14px; background:var(--card); border:1px dashed var(--line);
  border-radius:12px; padding:10px 12px}
.sec-block{margin:16px 0}
.sec-title{font-size:17px; font-weight:800; margin-bottom:6px}
.sec-list{margin:0; padding-left:20px}
.sec-item{margin:5px 0}
.footer-note{color:var(--sub); font-size:13px; text-align:center; margin-top:36px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <div class="brand">🍲 家常菜谱集</div>
      <div class="brand-sub">妈妈模式 · 饮食 —— 做过的、攒下的，都在这儿</div>
    </div>
    <button class="dark-btn" id="darkBtn" type="button">🌙 深色</button>
  </div>

  <div class="season">
    <div class="season-title">🥬 11 月郑州应季采购</div>
    <div>应季：白萝卜、南瓜、山药、莲藕、菠菜、上海青、芹菜、鲜香菇。渠道：盒马（净菜鲜切方便）· 鲜风生活 / 华豫百家（本地连锁、叶菜新鲜）· 菜市场（新鲜上限）。</div>
  </div>

  <div class="searchbar">
    <input class="search-input" id="searchInput" type="search" placeholder="搜菜名、食材、品牌，比如：羊肉 / 香菇 / 名扬">
  </div>

  <div class="filters">
    <div class="filter-group" id="fgCuisine">
      <div class="filter-label">菜系</div>
    </div>
    <div class="filter-group" id="fgType">
      <div class="filter-label">类型</div>
    </div>
    <div class="filter-group" id="fgTaste">
      <div class="filter-label">口味</div>
    </div>
  </div>

  <div class="count-line" id="countLine"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyBox" style="display:none">没找到合适的，换个关键词试试 🍳</div>
  <div class="footer-note">家常菜谱集 · 内容来自日常做饭积累与公开讨论整理，品牌口碑为网友评价、仅供参考</div>
</div>

<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

{id:"huoguo", name:"在家复刻川渝火锅", cuisine:"火锅", type:"讨论", taste:"味重", time:"讨论整理", level:"经验帖整理", servings:"",

 ingredients:[], steps:[], heat:"", tips:"", buy:"",

 sections:[
 {t:"一、配比口径（油和料分开算，三个口径并存）", items:[
  "邮寄套装口径：成都/重庆本地火锅店邮寄装约 50 元/套 ＝ 一斤油 + 一斤底料 + 调味粉 + 花椒辣椒；配水不要太多，2 斤左右就够。",
  "家用锅口径：直径 28-34cm 普通锅，一锅水直接放一斤火锅底料；底料选特辣不要微辣，另加鸡精等调味。",
  "油料比口径：核心是「一包底料、两包油」，油要舍得放；也有人说锅底量至少是自己以为的四倍以上。",
  "争议项：有人说「等水开再下底料是关键」，也有人先下料加凉水，帖内未定论。",
  "进阶做法：底料切碎、小火先炒出油再加骨汤/开水；或热油先炒香大葱、花椒、干辣椒、生姜再下底料炒化；补味靠姜、大葱段、干花椒辣椒、醪糟、鸡精、五香八角。"]},
 {t:"二、为什么包装底料不够香", items:[
  "网上买的底料油渣比太低，可能 3:1 甚至更低；要香就得猛加牛油——单独买不咸的纯牛油配普通底料。",
  "一句话总结：外面好吃就两条——牛油和大火。"]},
 {t:"三、牛油品牌（单买补油）", items:[
  "森态牛油：名扬底料想更香更浓时加它。",
  "秋霞：是「牛油锅底」（底料本身牛油足），被说比较接近当地口味；重庆认的牌子里也有秋霞。",
  "叮咚上买牛油火锅底料、多放几块也行。"]},
 {t:"四、底料品牌口碑（帖内评价，分歧大）", items:[
  "名扬：提及最多、多人主力，楼主最后也退了周大签改买名扬；但有人说名扬吃到后面发酸。",
  "桥头：有家庭常备；重庆认德庄、桥头、秋霞；但桥头要煮 30 分钟辣味才出来，可作入门款。",
  "四川本地口径：红 99、大红袍——「家里和周边人只认这两个」，便宜选红 99。",
  "其他被推荐：德庄、好人家、王家渡（外面一般买不到）、麻辣江湖（有人推清油版，更清爽）、麻辣空间、挑爷（淘宝，牛油非常足，像连锁店味）、山姆的火锅底料（更适合外地人、不燥辣、带高汤包）。",
  "饭巢：有人说比名扬还好吃（转述，待验证）。王刚：有人推荐，有人买过说性价比不高。",
  "网红款：王胖娃、李命佳、歪炀炀，仅个别提及。",
  "差评明确：周大签、文成——买过的人说能尝出牛油生腥味；但也有人说周大签不错，属分歧项。"]},
 {t:"五、油碟与香油（帖内有分歧）", items:[
  "一派：火锅香油本就是调和油（芝麻油+玉米油），纯芝麻香油苦味重、不适合当油碟。",
  "另一派：自己吃买纯芝麻的，不要调和的。",
  "品牌：油碟香油可选馨田。",
  "蘸料共识：蒜要给足，「超级多的蒜 + 油碟，无敌」；成品蒜蓉口碑一般，能现剁最好。",
  "蘸料进阶方（「牛肉受得醋辣子」）：半碗姜蒜、葱花、2 个小米辣，可加花椒面/贵州辣椒面，一勺鸡精，半碗味极鲜，保宁醋、香油、盐适量；最后烧油至冒烟淋入碗中「呲香」。"]},
 {t:"六、肉与食材（品类错位 + 处理法）", items:[
  "品类错位：吊龙、匙柄是潮汕牛肉火锅的吃法（屠宰后几小时上桌、配清汤），不适配川渝红油锅；川渝锅更搭毛肚、黄喉、内脏下水。坚持牛肉+辣锅+油碟也可以，但属混搭。",
  "川渝吃牛肉要处理：黄牛后腿肉上浆裹糊辣椒面，或牛肉片裹泡椒、酸豇豆、香菜芹菜；鲜牛肉不处理，在红油锅里极易煮老。",
  "四川家庭处理法：牛肉/肥牛/吊龙优先菜市场或大超市新鲜刀切；拿回来只淋菜籽油（备选花生油）手抓匀，冰箱冷藏 10 分钟，千万别放盐。还可以放半只清远鸡打锅底。",
  "增味平替：牛尾巴（焯水冻存，吃时高压锅先压再入锅）、牛腩、排骨 + 土豆 + 年糕片、油条、千张，经济实惠。",
  "买肉渠道：山姆肥牛性价比被多人认可，山姆牛肉丸质感仅次于海底捞；盒马相对可选肥胼 + 吊龙或牛肉拼盘（约 2 人量），火锅豆花手掰下锅；农贸市场鲜切是上限。",
  "必备配菜参考：豆腐皮、腐竹、无骨鸭掌、香豆干、金针菇、脆皮肠、三秒海带、蓬蒿、西洋菜。",
  "外地难复刻：黑/粉色嫩毛肚、耗儿鱼、火箭鱿鱼、卤大肠，江浙难买，网购冷冻款多人反馈腥臭，不建议硬凑；冻货腥多与反复解冻、未做去腥处理有关。"]},
 {t:"七、热量纠偏", items:[
  "红油锅底 + 油碟热量爆炸，和麻酱碟差不多，都是高脂肪；换油碟不等于减脂，牛肉也不自动等于不长胖。",
  "控热量路线：降频率，或清水潮汕吃法（白水 + 葱姜 + 萝卜玉米块煮底）。"]},
 {t:"八、老油与健康（收录口径取谨慎侧）", items:[

 {t:"九、落地结论 / 最小可行版", items:[
  "不会炒料又追求地道，不如出去吃（海底捞只是「能吃、算不上特别好」）；自己做胜在乐趣，性价比和体验大概率不如店里。",

<script>
"use strict";
const state = {cuisine:"全部", type:"全部", taste:"全部", kw:""};
const CUISINES = ["全部","川菜","湘菜","家常","火锅"];
const TYPES = ["全部","菜谱","讨论"];
const TASTES = ["全部","清淡","家常","味重"];
const grid = document.getElementById("grid");
const emptyBox = document.getElementById("emptyBox");
const countLine = document.getElementById("countLine");
const modalMask = document.getElementById("modalMask");
const modalBox = document.getElementById("modalBox");

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function buildChips(boxId, list, key){
  const box = document.getElementById(boxId);
  list.forEach(function(v){
    const b = document.createElement("button");
    b.type = "button";
    b.className = "chip" + (state[key] === v ? " chip-on" : "");
    b.textContent = v;
    b.addEventListener("click", function(){
      state[key] = v;
      box.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("chip-on"); });
      b.classList.add("chip-on");
      render();
    });
    box.appendChild(b);
  });
}
buildChips("fgCuisine", CUISINES, "cuisine");
buildChips("fgType", TYPES, "type");
buildChips("fgTaste", TASTES, "taste");

function matchKw(e){
  if(!state.kw) return true;
  const parts = [e.name, e.cuisine, e.type, e.taste, e.desc, e.tips, e.buy];
  (e.ingredients || []).forEach(function(x){ parts.push(x); });
  (e.sections || []).forEach(function(s){ parts.push(s.t); s.items.forEach(function(x){ parts.push(x); }); });
  return parts.join(" ").toLowerCase().indexOf(state.kw) >= 0;
}
function render(){
  const list = ENTRIES.filter(function(e){
    return (state.cuisine === "全部" || e.cuisine === state.cuisine)
      && (state.type === "全部" || e.type === state.type)
      && (state.taste === "全部" || e.taste === state.taste)
      && matchKw(e);
  });
  grid.innerHTML = "";
  list.forEach(function(e){
    const card = document.createElement("div");
    card.className = "card";
    let tags = "<span class='tag tag-cuisine'>" + esc(e.cuisine) + "</span>"
      + "<span class='tag tag-type'>" + esc(e.type) + "</span>";
    if(e.taste) tags += "<span class='tag'>" + esc(e.taste) + "</span>";
    tags += "<span class='tag tag-time'>⏱ " + esc(e.time) + "</span>";
    card.innerHTML = "<div class='card-name'>" + esc(e.name) + "</div>"
      + "<div class='card-tags'>" + tags + "</div>"
      + "<div class='card-desc'>" + esc(e.desc) + "</div>";
    card.addEventListener("click", function(){ openDetail(e); });
    grid.appendChild(card);
  });
  emptyBox.style.display = list.length ? "none" : "block";
  countLine.textContent = "共 " + list.length + " 条（总收录 " + ENTRIES.length + " 条）";
}
document.getElementById("searchInput").addEventListener("input", function(ev){
  state.kw = ev.target.value.trim().toLowerCase();
  render();
});

function openDetail(e){
  let h = "<button class='modal-close' id='modalClose' type='button'>✕</button>";
  h += "<div class='d-title'>" + esc(e.name) + "</div>";
  let meta = "<span class='tag tag-cuisine'>" + esc(e.cuisine) + "</span>"
    + "<span class='tag tag-type'>" + esc(e.type) + "</span>";
  if(e.taste) meta += "<span class='tag'>" + esc(e.taste) + "口味</span>";
  meta += "<span class='tag tag-time'>⏱ " + esc(e.time) + "</span>";
  if(e.level) meta += "<span class='tag'>" + esc(e.level) + "</span>";
  if(e.servings) meta += "<span class='tag'>" + esc(e.servings) + "</span>";
  h += "<div class='d-meta'>" + meta + "</div>";
  if(e.source) h += "<div class='src-note'>" + esc(e.source) + "</div>";
  if(e.type === "菜谱"){
    h += "<div class='d-sec'><div class='d-sec-title'>🧂 材料</div><ul class='ing-list'>"
      + e.ingredients.map(function(x){ return "<li class='ing-item'>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
    h += "<div class='d-sec'><div class='d-sec-title'>👩‍🍳 步骤</div><div class='step-list'>"
      + e.steps.map(function(s, i){
          return "<div class='step-item'><div class='step-num'>" + (i + 1) + "</div>"
            + "<div class='step-text'>" + esc(s[0]) + "</div>"
            + "<div class='step-time'>" + esc(s[1]) + "</div></div>";
        }).join("") + "</div></div>";
    if(e.heat) h += "<div class='d-sec'><div class='heat-box'><div class='box-label'>🔥 火候提醒</div><div>" + esc(e.heat) + "</div></div></div>";
    if(e.tips) h += "<div class='d-sec'><div class='tip-box'><div class='box-label'>💡 关键技巧</div><div>" + esc(e.tips) + "</div></div></div>";
    if(e.buy) h += "<div class='d-sec'><div class='buy-box'><div class='box-label'>🛒 采购提示</div><div>" + esc(e.buy) + "</div></div></div>";
  } else {
    e.sections.forEach(function(s){
      h += "<div class='sec-block'><div class='sec-title'>" + esc(s.t) + "</div><ul class='sec-list'>"
        + s.items.map(function(x){ return "<li class='sec-item'>" + esc(x) + "</li>"; }).join("") + "</ul></div>";
    });
  }
  modalBox.innerHTML = h;
  modalMask.classList.add("modal-mask-open");
  modalBox.scrollTop = 0;
  document.getElementById("modalClose").addEventListener("click", closeDetail);
  document.body.style.overflow = "hidden";
}
function closeDetail(){
  modalMask.classList.remove("modal-mask-open");
  document.body.style.overflow = "";
}
modalMask.addEventListener("click", function(ev){ if(ev.target === modalMask) closeDetail(); });
document.addEventListener("keydown", function(ev){ if(ev.key === "Escape") closeDetail(); });

const darkBtn = document.getElementById("darkBtn");
function applyDark(on){
  document.documentElement.classList.toggle("dark", on);
  darkBtn.textContent = on ? "☀️ 浅色" : "🌙 深色";
  try{ localStorage.setItem("recipes-dark", on ? "1" : "0"); }catch(err){}
}
let initDark = false;
try{
  const saved = localStorage.getItem("recipes-dark");
  initDark = saved !== null ? saved === "1" : window.matchMedia("(prefers-color-scheme: dark)").matches;
}catch(err){}
applyDark(initDark);
darkBtn.addEventListener("click", function(){
  applyDark(!document.documentElement.classList.contains("dark"));
});
render();
</script>
</body>
</html>
